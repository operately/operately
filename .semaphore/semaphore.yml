version: v1.0
name: Operately — Build & Test
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

auto_cancel:
  running:
    when: "branch != 'main'"

blocks:
  - name: License Check
    dependencies: []
    task:
      secrets:
        - name: ci-cache-credentials
      prologue:
        commands:
          - checkout
          - cache restore app-deps-v2-$(checksum app/mix.lock)-$(checksum app/mix.exs)
          - cache restore app-build-v2-$SEMAPHORE_AGENT_MACHINE_OS_IMAGE-$(checksum app/mix.lock)-$(checksum app/mix.exs)
          - cache restore app-node-modules-v2-$(checksum app/package-lock.json)
          - cache restore turboui-node-modules-v2-$(checksum turboui/package-lock.json)
          - cache restore turboui-dist-v2-$(git rev-parse HEAD:turboui)
          - ./scripts/cache-fix-for-erlang
          - make test.setup.license
      jobs:
        - name: Licence Check
          commands:
            - make test.license.check

  - name: Turboui
    run:
      when: "change_in('/turboui', {default_branch: 'main'})"
    dependencies: []
    task:
      secrets:
        - name: ci-cache-credentials
      prologue:
        commands:
          - checkout
          - cache restore turboui-node-modules-v2-$(checksum turboui/package-lock.json)

      jobs:
        - name: Turbo Lint
          commands:
            - make test.setup.turboui
            - make turboui.build

        - name: Turbo Test
          commands:
            - make test.setup.turboui
            - make turboui.test

        - name: Turbo Storybook Test
          commands:
            - make test.setup.turboui
            - make turboui.test.storybook

      epilogue:
        always:
          commands:
            - "[ -f turboui/testreports/junit.xml ] && test-results publish turboui/testreports/junit.xml"
            - "[ -f turboui/testreports/junit-storybook.xml ] && test-results publish turboui/testreports/junit-storybook.xml"

  - name: App Tests
    run:
      when: "change_in('/app', {default_branch: 'main'}) or change_in('/turboui', {default_branch: 'main'}) or change_in('/scripts/test_timings', {default_branch: 'main'}) or change_in('/scripts/test_splitting', {default_branch: 'main'}) or change_in('/scripts/run_unit_tests.js', {default_branch: 'main'}) or change_in('/scripts/run_feature_tests.js', {default_branch: 'main'}) or change_in('/Makefile', {default_branch: 'main'}) or change_in('/.semaphore/semaphore.yml', {default_branch: 'main'})"
    dependencies: []
    task:
      secrets:
        - name: ci-cache-credentials
      prologue:
        commands:
          - checkout
          - cache restore app-deps-v2-$(checksum app/mix.lock)-$(checksum app/mix.exs)
          - cache restore app-build-v2-$SEMAPHORE_AGENT_MACHINE_OS_IMAGE-$(checksum app/mix.lock)-$(checksum app/mix.exs)
          - cache restore app-node-modules-v2-$(checksum app/package-lock.json)
          - cache restore cli-node-modules-v2-$(checksum cli/package-lock.json)
          - cache restore turboui-node-modules-v2-$(checksum turboui/package-lock.json)
          - cache restore turboui-dist-v2-$(git rev-parse HEAD:turboui)
          - ./scripts/cache-fix-for-erlang

      jobs:
        - name: Lint
          commands:
            - make test.setup.lint
            - make test.timings
            - make test.manifests
            - make test.js.dead.code
            - make test.tsc.lint
            - make test.cli.catalog.sync
            - make test.elixir.warnings
            - make test.pr.name
            - make test.icons.check

        - name: Dialyzer
          commands:
            - make test.setup.dialyzer
            - make test.dialyzer

        - name: EE Tests
          commands:
            - make test.setup.ee
            - make test.ee

        - name: JS Tests
          commands:
            - make test.setup.js
            - make test.npm

      epilogue:
        always:
          commands:
            - "[ -f app/testreports/junit.xml ] && test-results publish app/testreports/junit.xml"
            - "[ -f app/testreports/junit-jest.xml ] && test-results publish app/testreports/junit-jest.xml"
            - ./scripts/publish_retries_report.sh app/testreports/retries.md

  - name: Prepare Test Manifests
    run:
      when: "change_in('/app', {default_branch: 'main'}) or change_in('/turboui', {default_branch: 'main'}) or change_in('/scripts/test_timings', {default_branch: 'main'}) or change_in('/scripts/test_splitting', {default_branch: 'main'}) or change_in('/scripts/run_unit_tests.js', {default_branch: 'main'}) or change_in('/scripts/run_feature_tests.js', {default_branch: 'main'}) or change_in('/Makefile', {default_branch: 'main'}) or change_in('/.semaphore/semaphore.yml', {default_branch: 'main'})"
    dependencies: []
    task:
      prologue:
        commands:
          - checkout
      jobs:
        - name: Prepare Test Manifests
          commands:
            - artifact pull project ci/test-timings-v1.json -d /tmp/test-timings-v1.json --force
            - make test.manifests.prepare TEST_TIMINGS_INPUT=/tmp/test-timings-v1.json
            - artifact push workflow test-manifests --force

  - name: Sharded App Tests
    run:
      when: "change_in('/app', {default_branch: 'main'}) or change_in('/turboui', {default_branch: 'main'}) or change_in('/scripts/test_timings', {default_branch: 'main'}) or change_in('/scripts/test_splitting', {default_branch: 'main'}) or change_in('/scripts/run_unit_tests.js', {default_branch: 'main'}) or change_in('/scripts/run_feature_tests.js', {default_branch: 'main'}) or change_in('/Makefile', {default_branch: 'main'}) or change_in('/.semaphore/semaphore.yml', {default_branch: 'main'})"
    dependencies:
      - Prepare Test Manifests
    task:
      secrets:
        - name: ci-cache-credentials
      prologue:
        commands:
          - checkout
          - cache restore app-deps-v2-$(checksum app/mix.lock)-$(checksum app/mix.exs)
          - cache restore app-build-v2-$SEMAPHORE_AGENT_MACHINE_OS_IMAGE-$(checksum app/mix.lock)-$(checksum app/mix.exs)
          - cache restore app-node-modules-v2-$(checksum app/package-lock.json)
          - cache restore cli-node-modules-v2-$(checksum cli/package-lock.json)
          - cache restore turboui-node-modules-v2-$(checksum turboui/package-lock.json)
          - cache restore turboui-dist-v2-$(git rev-parse HEAD:turboui)
          - ./scripts/cache-fix-for-erlang

      jobs:
        - name: Unit Tests
          parallelism: 3
          commands:
            - artifact pull workflow test-manifests --force
            - make test.setup.unit
            - make test.mix.unit MANIFEST=test-manifests/unit-$SEMAPHORE_JOB_INDEX.txt
            - make test.timings.extract TEST_TIMINGS_SUITE=unit TEST_TIMINGS_SHARD=$SEMAPHORE_JOB_INDEX
            - artifact push workflow -d test-timing-fragments/unit-$SEMAPHORE_JOB_INDEX.json /tmp/test-timing-unit-$SEMAPHORE_JOB_INDEX.json --force

        - name: Features
          parallelism: 18
          commands:
            - artifact pull workflow test-manifests --force
            - make test.setup.features
            - make test.mix.features MANIFEST=test-manifests/feature-$SEMAPHORE_JOB_INDEX.txt
            - make test.timings.extract TEST_TIMINGS_SUITE=feature TEST_TIMINGS_SHARD=$SEMAPHORE_JOB_INDEX
            - artifact push workflow -d test-timing-fragments/feature-$SEMAPHORE_JOB_INDEX.json /tmp/test-timing-feature-$SEMAPHORE_JOB_INDEX.json --force

      epilogue:
        always:
          commands:
            - "[ -f app/testreports/junit.xml ] && test-results publish app/testreports/junit.xml"
            - ./scripts/publish_retries_report.sh app/testreports/retries.md
            - artifact push workflow screenshots

  - name: CLI and MCP E2E
    run:
      when: "change_in('/cli', {default_branch: 'main'}) or change_in('/app', {default_branch: 'main'})"
    dependencies: []
    task:
      secrets:
        - name: ci-cache-credentials
      prologue:
        commands:
          - checkout
          - cache restore app-deps-v2-$(checksum app/mix.lock)-$(checksum app/mix.exs)
          - cache restore app-build-v2-$SEMAPHORE_AGENT_MACHINE_OS_IMAGE-$(checksum app/mix.lock)-$(checksum app/mix.exs)
          - cache restore app-node-modules-v2-$(checksum app/package-lock.json)
          - cache restore turboui-node-modules-v2-$(checksum turboui/package-lock.json)
          - cache restore turboui-dist-v2-$(git rev-parse HEAD:turboui)
          - cache restore cli-node-modules-v2-$(checksum cli/package-lock.json)
          - ./scripts/cache-fix-for-erlang

      jobs:
        - name: CLI Unit Tests
          commands:
            - make cli.test.unit

        - name: CLI E2E Tests
          commands:
            - make test.setup.cli_e2e
            - make cli.test.e2e

        - name: MCP E2E Tests
          commands:
            - make test.setup.mcp_e2e
            - make mcp.test.e2e

      epilogue:
        always:
          commands:
            - "[ -f app/testreports/junit.xml ] && test-results publish app/testreports/junit.xml"
            - "[ -f cli/testreports/junit.xml ] && test-results publish cli/testreports/junit.xml"
            - ./scripts/publish_retries_report.sh app/testreports/retries.md

  - name: Docker Build
    dependencies: []
    task:
      secrets:
        - name: docker-push
      prologue:
        commands:
          - checkout
          - cache restore
      jobs:
        - name: "Docker Release"
          commands:
            - docker pull operately/operately:latest
            - make docker.build
            - 'if [[ "$SEMAPHORE_GIT_BRANCH" = "main" && "$SEMAPHORE_GIT_REF_TYPE" = "branch" ]]; then make docker.push; else echo "Skipping Docker push"; fi'

  - name: Collect Test Timings
    dependencies:
      - License Check
      - Turboui
      - App Tests
      - Sharded App Tests
      - CLI and MCP E2E
      - Docker Build
    run:
      when: "change_in('/app', {default_branch: 'main'}) or change_in('/turboui', {default_branch: 'main'}) or change_in('/scripts/test_timings', {default_branch: 'main'}) or change_in('/scripts/test_splitting', {default_branch: 'main'}) or change_in('/scripts/run_unit_tests.js', {default_branch: 'main'}) or change_in('/scripts/run_feature_tests.js', {default_branch: 'main'}) or change_in('/Makefile', {default_branch: 'main'}) or change_in('/.semaphore/semaphore.yml', {default_branch: 'main'})"
    task:
      prologue:
        commands:
          - checkout
      jobs:
        - name: Collect Test Timings
          commands:
            - artifact pull workflow test-timing-fragments --force
            - make test.timings.merge
            - artifact push workflow -d test-timings/test-timings-v1.json /tmp/test-timings-v1.json --force
            - 'if [[ "$SEMAPHORE_GIT_BRANCH" = "main" && "$SEMAPHORE_GIT_REF_TYPE" = "branch" ]]; then artifact push project -d ci/test-timings-v1.json /tmp/test-timings-v1.json --force; else echo "Skipping project timing artifact"; fi'

after_pipeline:
  task:
    jobs:
      - name: Publish Results
        commands:
          - test-results gen-pipeline-report
          - checkout
          - mkdir -p /tmp/retries-md
          - artifact pull workflow retries-md -f -d /tmp/retries-md || true
          - ./scripts/build_retries_report.sh /tmp/retries-md > /tmp/REPORT.md
          - artifact push workflow -d .semaphore/REPORT.md /tmp/REPORT.md

promotions:
  - name: Publish Dev Image
    pipeline_file: devimage.yml
    auto_promote:
      when: "result = 'passed' and branch = 'main'"

  - name: Populate CI Cache
    pipeline_file: cache.yml
    auto_promote:
      when: "result = 'passed' and branch = 'main'"
